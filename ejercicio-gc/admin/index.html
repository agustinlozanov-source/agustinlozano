<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Facilitador · Gobierno Corporativo</title>
  <link rel="icon" type="image/png" href="/logos/SX Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/scalex-ui.css" />
  <link rel="stylesheet" href="/ejercicio-gc/assets/gc.css" />
</head>
<body class="sx">
  <div class="sx-topbar">
    <img class="sx-logo" src="/logos/Logo SCALEx blanco.png" alt="SCALEx" />
    <span class="sx-chip">Panel del facilitador</span>
  </div>
  <div class="header">
    <div class="sub">Panel del facilitador</div>
    <h1>¿Qué es Gobierno Corporativo?</h1>
  </div>

  <main class="body">
    <div id="err" class="err hidden"></div>

    <!-- Sin token -->
    <section id="noauth" class="hidden">
      <div class="card"><p class="text">Enlace del facilitador inválido. Abre esta página con tu token secreto: <code>/ejercicio-gc/admin?k=TU_TOKEN</code></p></div>
    </section>

    <section id="panel" class="admin-panel hidden">
      <div class="center mt">
        <div class="pill-count" id="resp-count">0</div>
        <div class="admin-status">respuestas recibidas · <span id="estado-badge"></span></div>
      </div>

      <button id="btn-sintetizar" class="btn">Sintetizar respuestas en 3 opciones</button>
      <button id="btn-reset" class="btn ghost mt">Reiniciar ejercicio</button>
      <div id="msg" class="mt center"></div>

      <div class="section-label">Respuestas del grupo (<span id="resp-count2">0</span>)</div>
      <div id="lista"></div>

      <div id="resultados" class="hidden">
        <div class="section-label">Síntesis y votación</div>
        <div id="opciones-res"></div>
      </div>
    </section>
  </main>

  <script src="/assets/js/scalex-ui.js" defer></script>
  <script type="module" src="/ejercicio-gc/admin/gc-admin.js"></script>
</body>
</html>
