# ============================================================================
# SCALEx PORTAL — Configuración Netlify
# ============================================================================
# Coloca este archivo en la RAÍZ del repo (al lado del index.html).
# Si ya tienes un netlify.toml, MERGEA estas reglas con las tuyas.
# ============================================================================

# Funciones serverless (síntesis con IA del ejercicio de Gobierno Corporativo).
# La ANTHROPIC_API_KEY vive como variable de entorno en Netlify, nunca en el front.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ────────────────────────────────────────────────────────────────────────────
# REDIRECTS
# ────────────────────────────────────────────────────────────────────────────

# Si alguien va a /portal/ (sin archivo) → redirige al dashboard
[[redirects]]
  from = "/portal"
  to = "/portal/dashboard.html"
  status = 302
  force = false

[[redirects]]
  from = "/portal/"
  to = "/portal/dashboard.html"
  status = 302
  force = false

# Magic link de Supabase llega como /portal/dashboard.html#access_token=...
# Netlify ya sirve el archivo correctamente, no requiere redirect extra.

# ────────────────────────────────────────────────────────────────────────────
# HEADERS DE SEGURIDAD
# ────────────────────────────────────────────────────────────────────────────

# Headers para todo el portal
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# JS del portal — nunca cachear (cambia frecuentemente)
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Sección OCULTA de evaluaciones — no indexar en buscadores
[[headers]]
  for = "/evaluaciones/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Dashboard OCULTO de resultados — no indexar (contiene datos personales)
[[headers]]
  for = "/resultados/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Ejercicio interactivo (en vivo en clase) — no indexar
[[headers]]
  for = "/ejercicio-gc/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Las páginas HTML del portal NO se cachean (data dinámica)
[[headers]]
  for = "/portal/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
