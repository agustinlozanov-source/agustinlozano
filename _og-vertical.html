<!doctype html>
<!-- Imagen para mandar por WhatsApp. Regenerar:
     Chrome --headless --window-size=1080,1350 --screenshot=salida.png <esta url> -->
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Host Grotesk';font-style:normal;font-weight:300 800;src:url(https://fonts.gstatic.com/s/hostgrotesk/v5/co3BmWBnlCJ3U42vbbfdwMjZpFjm.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Host Grotesk',Arial,sans-serif;background:#232323;color:#f4f4f4;display:flex;flex-direction:column}
.foto{height:690px;flex:none;position:relative;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:70% 24%}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 74%,rgba(35,35,35,.6) 89%,#232323 100%)}
.txt{flex:1;padding:0 74px 58px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:22px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#dfff18;margin-bottom:20px}
h1{font-size:78px;font-weight:600;line-height:.94;letter-spacing:-.045em}
.sub{margin-top:24px;font-size:31px;line-height:1.32;letter-spacing:-.015em;color:rgba(244,244,244,.76)}
.datos{display:flex;flex-direction:column;gap:13px;margin-top:38px}
.fila{display:flex;align-items:center;gap:17px;font-size:29px;font-weight:600;letter-spacing:-.015em}
.pt{width:11px;height:11px;flex:none;border-radius:50%;background:#dfff18}
.pie{margin-top:40px;padding-top:26px;border-top:1px solid rgba(244,244,244,.2);font-size:27px;letter-spacing:-.01em;color:rgba(244,244,244,.62)}
.pie b{color:#f4f4f4;font-weight:600}
</style></head>
<body>
  <div class="foto"><img src="imagenes/hero-tino.webp" alt=""></div>
  <div class="txt">
    <div class="eyebrow">Taller in company · Tino Lozano</div>
    <h1>Alto rendimiento<br>in company</h1>
    <p class="sub">Cómo se mide un equipo y cómo se automatiza una operación.</p>
    <div class="datos">
      <div class="fila"><span class="pt"></span>Día y medio, en tu empresa</div>
      <div class="fila"><span class="pt"></span>Hasta 15 personas</div>
      <div class="fila"><span class="pt"></span>Salen con su tablero midiendo</div>
    </div>
    <p class="pie">Programa, fechas y precio en <b>agustinlozano.com/alto-rendimiento</b></p>
  </div>
</body></html>
