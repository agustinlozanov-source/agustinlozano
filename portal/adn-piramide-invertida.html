<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCALEx Portal — ADN · Paso 3 · Pirámide Invertida</title>
  <link rel="icon" type="image/png" href="/logos/SX Icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/assets/js/auth-guard.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #1aab99; --teal-light: rgba(26,171,153,0.12);
      --indigo: #3533cd; --indigo-light: rgba(53,51,205,0.12);
      --gradient: linear-gradient(135deg, #1aab99, #3533cd);
      --pink: #ec4899; --pink-light: rgba(236,72,153,0.12);
      --green: #00c853; --green-light: rgba(0,200,83,0.12);
      --amber: #ff9500; --amber-light: rgba(255,149,0,0.12);
      --red: #ff3b30; --red-light: rgba(255,59,48,0.12);
      --gold: #d4a256; --gold-light: rgba(212,162,86,0.12);
      --radius-xl: 28px; --radius-lg: 20px; --radius: 14px; --radius-sm: 9px;
      --sidebar-w: 80px;
      font-family: 'Inter', sans-serif; line-height: 1.6;
    }
    [data-theme="dark"] {
      --bg-page: #0a0a0c; --bg-shell: #141416; --bg-card: #1c1c1e; --bg-card-2: #242426;
      --surface: rgba(255,255,255,0.04); --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.13);
      --text: #fff; --text-2: #c7c7cc; --text-3: #8e8e93; --text-4: #48484a;
      --sidebar-bg: #050506;
    }
    [data-theme="light"] {
      --bg-page: #eef0f5; --bg-shell: #fff; --bg-card: #f5f5f7; --bg-card-2: #ebebef;
      --surface: rgba(0,0,0,0.03); --surface-hover: rgba(0,0,0,0.055);
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
      --text: #070708; --text-2: #3a3a3c; --text-3: #6e6e73; --text-4: #c7c7cc;
      --sidebar-bg: #0a0a0c;
    }
    body { background:var(--bg-page); color:var(--text); min-height:100vh; overflow:hidden; transition:background .3s,color .3s; }
    .shell { height:calc(100vh - 32px); overflow:hidden; }
    .app-layout { display:flex; min-height:100vh; padding:16px; gap:16px; }

    /* SIDEBAR */
    .sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); border-radius:var(--radius-xl); padding:20px 0; display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; position:sticky; top:16px; height:calc(100vh - 32px); }
    .sidebar-logo { width:44px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; text-decoration:none; }
    .sidebar-logo img { width:100%; display:block; }
    .sidebar-divider { width:28px; height:1px; background:rgba(255,255,255,0.08); margin:4px 0; }
    .sidebar-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:rgba(255,255,255,0.5); position:relative; text-decoration:none; background:none; border:none; }
    .sidebar-icon:hover { background:rgba(255,255,255,0.06); color:white; }
    .sidebar-icon.active { background:var(--gradient); color:white; }
    .sidebar-icon.active::before { content:''; position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:3px; height:24px; background:var(--teal); border-radius:0 3px 3px 0; }
    .sidebar-icon svg { width:20px; height:20px; }
    .sidebar-nav { flex:1; width:100%; overflow-y:auto; overflow-x:hidden; min-height:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:4px 0; }
    .sidebar-nav::-webkit-scrollbar { width:3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:99px; }
    .sidebar-bottom { display:flex; flex-direction:column; gap:8px; align-items:center; padding-bottom:4px; }

    /* SHELL */
    .shell { flex:1; background:var(--bg-shell); border-radius:var(--radius-xl); display:flex; flex-direction:column; overflow:hidden; min-width:0; height:calc(100vh - 32px); }

    /* TOPBAR */
    .topbar { padding:18px 28px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .topbar-back { width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:var(--text-2); text-decoration:none; }
    .topbar-back:hover { background:var(--surface-hover); color:var(--text); }
    .topbar-back svg { width:16px; height:16px; }
    .topbar-title-block { flex:1; }
    .topbar-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--pink); }
    .topbar-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; font-weight:800; color:var(--text); letter-spacing:-0.3px; margin-top:2px; }
    .topbar-actions { display:flex; align-items:center; gap:10px; }
    .topbar-icon-btn { width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:var(--text-2); }
    .topbar-icon-btn:hover { background:var(--surface-hover); color:var(--text); }
    .topbar-icon-btn svg { width:16px; height:16px; }

    /* CONTENT */
    .content { flex:1; overflow-y:auto; padding:28px 32px; display:flex; flex-direction:column; gap:28px; }
    .content::-webkit-scrollbar { width:4px; }
    .content::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:99px; }

    /* HEADER SUMMARY */
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .summary-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 24px; display:flex; flex-direction:column; gap:8px; }
    .summary-card-eyebrow { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); }
    .summary-card-title { font-size:20px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; }
    .summary-card-sub { font-size:13px; color:var(--text-3); line-height:1.5; }
    .summary-card-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:600; width:fit-content; margin-top:4px; }

    /* SECTION HEADER */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .section-title { font-size:15px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; }
    .section-count { font-size:12px; color:var(--text-3); }

    /* PYRAMID WRAPPER */
    .pyramid-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
    .pyramid-header { padding:20px 24px 16px; border-bottom:1px solid var(--border); }
    .pyramid-title { font-size:16px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; margin-bottom:4px; }
    .pyramid-sub { font-size:13px; color:var(--text-3); }

    /* LAYERS */
    .layers { display:flex; flex-direction:column; }
    .layer { display:grid; grid-template-columns:160px 1fr; border-bottom:1px solid var(--border); }
    .layer:last-child { border-bottom:none; }
    .layer-label { padding:20px; display:flex; flex-direction:column; justify-content:center; gap:4px; border-right:1px solid var(--border); background:var(--surface); }
    .layer-label-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
    .layer-label-icon svg { width:16px; height:16px; }
    .layer-label-name { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .layer-label-desc { font-size:11px; color:var(--text-3); line-height:1.4; }
    .layer-content { padding:16px 20px; display:flex; flex-wrap:wrap; gap:8px; align-content:center; min-height:72px; }

    /* CHIPS */
    .chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid; }
    .chip-publico { background:rgba(236,72,153,0.1); border-color:rgba(236,72,153,0.25); color:var(--pink); }
    .chip-diferenciador { background:rgba(26,171,153,0.1); border-color:rgba(26,171,153,0.25); color:var(--teal); }
    .chip-habilitador { background:rgba(53,51,205,0.12); border-color:rgba(53,51,205,0.3); color:#7b7ef4; }
    .chip-rector { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid; }
    .chip-rector-operativo { background:rgba(0,200,83,0.1); border-color:rgba(0,200,83,0.25); color:var(--green); }
    .chip-rector-declarado { background:rgba(255,149,0,0.1); border-color:rgba(255,149,0,0.25); color:var(--amber); }
    .chip-rector-ausente { background:var(--surface); border-color:var(--border); color:var(--text-4); }
    .chip-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

    /* RECTOR GRID */
    .rectores-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:16px 20px; }
    .rector-chip { padding:10px 14px; border-radius:var(--radius-sm); border:1px solid; display:flex; flex-direction:column; gap:4px; }
    .rector-chip-name { font-size:12px; font-weight:700; }
    .rector-chip-meta { display:flex; align-items:center; gap:6px; }
    .rector-chip-estado { font-size:11px; font-weight:600; }
    .rector-chip-ano { font-size:11px; color:var(--text-3); }
    .rector-operativo { background:rgba(0,200,83,0.08); border-color:rgba(0,200,83,0.2); }
    .rector-declarado { background:rgba(255,149,0,0.08); border-color:rgba(255,149,0,0.2); }
    .rector-ausente { background:var(--surface); border-color:var(--border); }

    /* DESCRIPCION PIRAMIDE */
    .piramide-detail { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; display:flex; flex-direction:column; gap:16px; }
    .piramide-detail-header { display:flex; align-items:flex-start; gap:16px; }
    .piramide-detail-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .piramide-detail-icon svg { width:22px; height:22px; }
    .piramide-detail-title { font-size:18px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; margin-bottom:4px; }
    .piramide-detail-rango { font-size:12px; font-weight:600; opacity:.7; }
    .piramide-detail-desc { font-size:14px; color:var(--text-2); line-height:1.65; }
    .piramide-indicadores { display:flex; flex-direction:column; gap:8px; }
    .piramide-indicadores-title { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:4px; }
    .piramide-indicador { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--text-2); line-height:1.5; }
    .piramide-indicador::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--teal); flex-shrink:0; margin-top:7px; }
    .piramide-proximo { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; font-size:13px; color:var(--text-2); line-height:1.6; }
    .piramide-proximo strong { color:var(--text); }

    /* HIBRIDO CARD */
    .hibrido-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; display:flex; gap:20px; align-items:flex-start; }
    .hibrido-icon { width:52px; height:52px; border-radius:14px; background:var(--pink-light); border:1px solid rgba(236,72,153,0.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hibrido-icon svg { width:24px; height:24px; color:var(--pink); }
    .hibrido-body { flex:1; }
    .hibrido-eyebrow { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--pink); margin-bottom:4px; }
    .hibrido-nombre { font-size:20px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; margin-bottom:8px; }
    .hibrido-esencia { font-size:14px; color:var(--text-2); line-height:1.65; margin-bottom:12px; }
    .hibrido-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .hibrido-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; }
    .hibrido-box-label { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
    .hibrido-box-text { font-size:13px; color:var(--text-2); line-height:1.5; }

    /* EMPTY STATE */
    .empty-chip { font-size:12px; color:var(--text-4); font-style:italic; padding:6px 0; }

    /* SKELETON */
    .skeleton { background:var(--surface); border-radius:8px; animation:skeleton-pulse 1.4s ease-in-out infinite; }
    @keyframes skeleton-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <a href="/portal/dashboard.html" class="sidebar-logo">
      <img src="/logos/SX Icon.png" alt="SCALEx">
    </a>
    <div class="sidebar-divider"></div>
    <div class="sidebar-nav" id="sidebar-nav">
      <a href="/portal/dashboard.html" class="sidebar-icon" title="Dashboard"><i data-lucide="layout-dashboard"></i></a>
      <a href="/portal/opsp.html" class="sidebar-icon" title="OPSP"><i data-lucide="compass"></i></a>
      <a href="/portal/adn.html" class="sidebar-icon active" id="sidebar-adn" title="ADN"><i data-lucide="dna"></i></a>
    </div>
    <div class="sidebar-bottom" id="sidebar-bottom"></div>
  </nav>

  <!-- SHELL -->
  <main class="shell">

    <!-- TOPBAR -->
    <div class="topbar">
      <a href="/portal/adn.html" class="topbar-back">
        <i data-lucide="arrow-left"></i>
      </a>
      <div class="topbar-title-block">
        <div class="topbar-eyebrow">PILAR · ADN · PASO 3</div>
        <div class="topbar-title">Pirámide Invertida</div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" id="theme-toggle" title="Cambiar tema">
          <i data-lucide="sun"></i>
        </button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="main-content">

      <!-- RESUMEN SUPERIOR: PIRÁMIDE + HÍBRIDO -->
      <div class="summary-grid" id="summary-grid">
        <div class="summary-card skeleton" style="height:130px"></div>
        <div class="summary-card skeleton" style="height:130px"></div>
      </div>

      <!-- PIRÁMIDE INVERTIDA VISUAL -->
      <div class="pyramid-wrap" id="pyramid-wrap">
        <div class="pyramid-header">
          <div class="pyramid-title">Estructura ADN de la empresa</div>
          <div class="pyramid-sub">Las 4 capas que sostienen la identidad y el poder operativo.</div>
        </div>
        <div class="layers" id="layers">
          <div style="padding:40px;text-align:center;color:var(--text-4)" class="skeleton" style="height:200px"></div>
        </div>
      </div>

      <!-- DETALLE PIRÁMIDE -->
      <div id="piramide-detail-wrap"></div>

      <!-- DETALLE HÍBRIDO -->
      <div id="hibrido-detail-wrap"></div>

    </div>
    <!-- /content -->

  </main>
  <!-- /shell -->

</div>

<script type="module" src="/assets/js/portal-shell.js"></script>
<script type="module" src="/assets/js/adn-piramide-invertida.js"></script>
</body>
</html>
