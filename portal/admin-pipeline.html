<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCALEx Portal — Pipeline Completo</title>
  <link rel="icon" type="image/png" href="/logos/SX Icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/assets/js/auth-guard.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:#070708;--white:#ffffff;--teal:#1aab99;--teal-light:rgba(26,171,153,.12);
      --indigo:#3533cd;--indigo-light:rgba(53,51,205,.12);--gradient:linear-gradient(135deg,#1aab99,#3533cd);
      --green:#00c853;--green-light:rgba(0,200,83,.12);--amber:#ff9500;--amber-light:rgba(255,149,0,.12);
      --red:#ff3b30;--red-light:rgba(255,59,48,.12);--purple:#7c3aed;
      --radius-xl:28px;--radius-lg:20px;--radius:14px;--radius-sm:9px;--sidebar-w:80px;
      font-family:'Inter',sans-serif;line-height:1.6;
    }
    [data-theme="dark"] {
      --bg-page:#0a0a0c;--bg-shell:#141416;--bg-card:#1c1c1e;--bg-card-2:#242426;
      --surface:rgba(255,255,255,.04);--surface-hover:rgba(255,255,255,.07);
      --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.13);
      --text:#ffffff;--text-2:#c7c7cc;--text-3:#8e8e93;--text-4:#48484a;--sidebar-bg:#050506;
    }
    [data-theme="light"] {
      --bg-page:#eef0f5;--bg-shell:#ffffff;--bg-card:#f5f5f7;--bg-card-2:#ebebef;
      --surface:rgba(0,0,0,.03);--surface-hover:rgba(0,0,0,.055);
      --border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.14);
      --text:#070708;--text-2:#3a3a3c;--text-3:#6e6e73;--text-4:#c7c7cc;--sidebar-bg:#0a0a0c;
    }
    body { background:var(--bg-page);color:var(--text);min-height:100vh;overflow:hidden;transition:background .3s,color .3s; }
    .app-layout { display:flex;min-height:100vh;padding:16px;gap:16px; }

    /* SIDEBAR */
    .sidebar { width:var(--sidebar-w);background:var(--sidebar-bg);border-radius:var(--radius-xl);padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;position:sticky;top:16px;height:calc(100vh - 32px);overflow:hidden; }
    .sidebar-logo { width:44px;height:auto;display:flex;align-items:center;justify-content:center;margin-bottom:16px; }
    .sidebar-logo img { width:100%;height:auto;display:block; }
    .sidebar-divider { width:28px;height:1px;background:rgba(255,255,255,.08);margin:4px 0; }
    .sidebar-icon { width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.5);text-decoration:none;background:none;border:none; }
    .sidebar-icon:hover { background:rgba(255,255,255,.06);color:white; }
    .sidebar-icon.active { background:var(--gradient);color:white; }
    .sidebar-icon svg { width:20px;height:20px; }
    .sidebar-nav { flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0; }
    .sidebar-nav::-webkit-scrollbar { width:3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2);border-radius:99px; }
    .sidebar-bottom { display:flex;flex-direction:column;gap:8px;align-items:center;padding-bottom:4px; }

    /* SHELL */
    .shell { flex:1;background:var(--bg-shell);border-radius:var(--radius-xl);overflow:hidden;display:flex;flex-direction:column;height:calc(100vh - 32px);min-width:0; }

    /* TOPBAR */
    .topbar { padding:18px 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);flex-shrink:0; }
    .topbar-title { font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700; }
    .topbar-sub { font-size:13px;color:var(--text-3);margin-top:1px; }
    .topbar-left { flex:1; }
    .topbar-actions { display:flex;align-items:center;gap:10px; }
    .btn-ghost { display:flex;align-items:center;gap:7px;background:var(--surface);color:var(--text-2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s; }
    .btn-ghost:hover { background:var(--surface-hover);color:var(--text); }
    .btn-ghost svg { width:14px;height:14px; }
    .search-input { background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text);font-size:13px;width:220px;outline:none;transition:border-color .2s; }
    .search-input:focus { border-color:var(--teal); }
    .search-input::placeholder { color:var(--text-4); }

    /* CONTENT */
    .content { flex:1;overflow-y:auto;padding:28px; }
    .content::-webkit-scrollbar { width:6px; }
    .content::-webkit-scrollbar-thumb { background:var(--border-strong);border-radius:99px; }

    /* SECTION HEADER */
    .section-header { display:flex;align-items:center;gap:12px;margin-bottom:20px; }
    .section-title { font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:800;flex:1; }
    .badge { font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface);color:var(--text-3); }
    .badge.teal { background:var(--teal-light);color:var(--teal); }

    /* METRICS GRID */
    .metrics-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:36px; }
    .metric-card { background:var(--bg-card);border-radius:var(--radius-lg);padding:20px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px; }
    .metric-label { font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em; }
    .metric-value { font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:900;line-height:1; }
    .metric-sub { font-size:12px;color:var(--text-3); }

    /* TABLE */
    .table-wrap { background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:auto; }
    table { width:100%;border-collapse:collapse; }
    thead th {
      padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;
      border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;cursor:pointer;user-select:none;
    }
    thead th:hover { color:var(--text); }
    thead th .sort-icon { opacity:.4;margin-left:4px; }
    thead th.sorted .sort-icon { opacity:1;color:var(--teal); }
    tbody tr { border-bottom:1px solid var(--border);transition:background .15s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--surface); }
    tbody td { padding:13px 16px;font-size:13px;color:var(--text-2);vertical-align:middle; }
    .consultor-name { font-weight:600;color:var(--text);font-size:13px; }
    .cert-badge { font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px; }
    .cert-badge.vigente { background:var(--teal-light);color:var(--teal); }
    .cert-badge.sin-cert { background:var(--surface);color:var(--text-4); }
    .tasa-bar { display:flex;align-items:center;gap:8px; }
    .tasa-fill { height:6px;border-radius:99px;background:var(--gradient);min-width:2px; }
    .tasa-num { font-size:11px;font-weight:700;color:var(--teal);white-space:nowrap; }
    .num-cell { font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--text); }
    .loading-row td { color:var(--text-4);text-align:center;padding:32px; }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width:6px;height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border-strong);border-radius:99px; }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="/portal/dashboard.html" class="sidebar-logo" style="text-decoration:none">
      <img src="/logos/SX Isp.png" alt="SCALEx">
    </a>
    <div class="sidebar-nav">
      <a href="/portal/dashboard.html" class="sidebar-icon" title="Dashboard"><i data-lucide="layout-dashboard"></i></a>
      <a href="/portal/opsp.html" class="sidebar-icon" title="OPSP"><i data-lucide="map"></i></a>
      <a href="/portal/rituales.html" class="sidebar-icon" title="Rituales"><i data-lucide="repeat"></i></a>
      <div class="sidebar-divider"></div>
      <a href="/portal/reflejo.html" class="sidebar-icon" title="Reflejo"><i data-lucide="eye"></i></a>
      <a href="/portal/vector.html" class="sidebar-icon" title="Vector"><i data-lucide="compass"></i></a>
      <a href="/portal/costeo.html" class="sidebar-icon" title="Costeo"><i data-lucide="calculator"></i></a>
      <a href="/portal/ritmo.html" class="sidebar-icon" title="Ritmo"><i data-lucide="activity"></i></a>
      <div class="sidebar-divider"></div>
      <a href="/portal/pipeline.html" class="sidebar-icon" title="Pipeline Consultor"><i data-lucide="kanban-square"></i></a>
      <a href="/portal/admin-pipeline.html" class="sidebar-icon active" title="Pipeline Global — Admin"><i data-lucide="trending-up"></i></a>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-icon" title="Cambiar tema" onclick="toggleTheme()"><i data-lucide="sun" id="theme-icon"></i></button>
      <button class="sidebar-icon" title="Cerrar sesión" onclick="logout()"><i data-lucide="log-out"></i></button>
    </div>
  </aside>

  <!-- SHELL -->
  <main class="shell">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Pipeline Global</div>
        <div class="topbar-sub">Métricas de pipeline por consultor</div>
      </div>
      <div class="topbar-actions">
        <input type="text" class="search-input" id="search-input" placeholder="Buscar consultor…">
        <button class="btn-ghost" onclick="cargarDatos()">
          <i data-lucide="refresh-cw"></i> Actualizar
        </button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- MÉTRICAS GLOBALES -->
      <div class="section-header">
        <div class="section-title">Resumen global</div>
        <div class="badge teal" id="badge-consultores">— consultores</div>
      </div>
      <div class="metrics-grid" id="metrics-grid">
        <div class="metric-card"><div class="metric-label">Prospectos totales</div><div class="metric-value" id="m-total">—</div></div>
        <div class="metric-card"><div class="metric-label">Cuentas activas</div><div class="metric-value" style="color:var(--green)" id="m-activos">—</div></div>
        <div class="metric-card"><div class="metric-label">En propuesta</div><div class="metric-value" style="color:var(--amber)" id="m-propuesta">—</div></div>
        <div class="metric-card"><div class="metric-label">Tasa de conversión</div><div class="metric-value" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent" id="m-tasa">—</div><div class="metric-sub">prospectos → activos</div></div>
      </div>

      <!-- TABLA CONSULTORES -->
      <div class="section-header">
        <div class="section-title">Por consultor</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('nombre')">Consultor <span class="sort-icon">↕</span></th>
              <th>Cert.</th>
              <th onclick="sortBy('total')" class="sorted">Total <span class="sort-icon">↓</span></th>
              <th onclick="sortBy('sin_contactar')">Sin cont. <span class="sort-icon">↕</span></th>
              <th onclick="sortBy('conversacion_iniciada')">Conv. <span class="sort-icon">↕</span></th>
              <th onclick="sortBy('reunion_agendada')">Reunión <span class="sort-icon">↕</span></th>
              <th onclick="sortBy('en_propuesta')">Propuesta <span class="sort-icon">↕</span></th>
              <th onclick="sortBy('cuenta_activa')">Activos <span class="sort-icon">↕</span></th>
              <th onclick="sortBy('tasa')">Tasa conv. <span class="sort-icon">↕</span></th>
            </tr>
          </thead>
          <tbody id="tabla-body">
            <tr class="loading-row"><td colspan="9">Cargando datos…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<script>lucide.createIcons()</script>
<script type="module" src="/assets/js/admin-pipeline.js"></script>
<script type="module" src="/assets/js/portal-shell.js"></script>

<script>
  function toggleTheme() {
    const html = document.documentElement
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
    html.setAttribute('data-theme', next)
    localStorage.setItem('scalex-theme', next)
    const icon = document.getElementById('theme-icon')
    if (icon) { icon.setAttribute('data-lucide', next === 'dark' ? 'sun' : 'moon'); lucide.createIcons() }
  }
  ;(function() {
    const saved = localStorage.getItem('scalex-theme')
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved)
      const icon = document.getElementById('theme-icon')
      if (icon) icon.setAttribute('data-lucide', saved === 'dark' ? 'sun' : 'moon')
    }
  })()
  async function logout() {
    const { signOut } = await import('/assets/js/supabase-client.js')
    await signOut()
  }
</script>

</body>
</html>
