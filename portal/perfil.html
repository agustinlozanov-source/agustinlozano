<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCALEx Portal — Mi Perfil</title>
  <link rel="icon" type="image/png" href="/logos/SX Icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/assets/js/auth-guard.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #070708; --white: #ffffff;
      --teal: #1aab99; --teal-light: rgba(26,171,153,0.12);
      --indigo: #3533cd; --indigo-light: rgba(53,51,205,0.12);
      --gradient: linear-gradient(135deg, #1aab99, #3533cd);
      --gradient-soft: linear-gradient(135deg, rgba(26,171,153,0.15), rgba(53,51,205,0.15));
      --green: #00c853; --green-light: rgba(0,200,83,0.12);
      --amber: #ff9500; --amber-light: rgba(255,149,0,0.12);
      --red: #ff3b30; --red-light: rgba(255,59,48,0.12);
      --purple: #7c3aed; --purple-light: rgba(124,58,237,0.12);
      --radius-xl: 28px; --radius-lg: 20px; --radius: 14px; --radius-sm: 9px;
      --sidebar-w: 80px;
      font-family: 'Inter', sans-serif; line-height: 1.6;
    }

    [data-theme="dark"] {
      --bg-page: #0a0a0c; --bg-shell: #141416; --bg-card: #1c1c1e; --bg-card-2: #242426;
      --surface: rgba(255,255,255,0.04); --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.13);
      --text: #ffffff; --text-2: #c7c7cc; --text-3: #8e8e93; --text-4: #48484a;
      --sidebar-bg: #050506;
    }
    [data-theme="light"] {
      --bg-page: #eef0f5; --bg-shell: #ffffff; --bg-card: #f5f5f7; --bg-card-2: #ebebef;
      --surface: rgba(0,0,0,0.03); --surface-hover: rgba(0,0,0,0.055);
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
      --text: #070708; --text-2: #3a3a3c; --text-3: #6e6e73; --text-4: #c7c7cc;
      --sidebar-bg: #0a0a0c;
    }

    body {
      background: var(--bg-page); color: var(--text);
      min-height: 100vh; overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .app-layout { display: flex; min-height: 100vh; padding: 16px; gap: 16px; }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w); background: var(--sidebar-bg);
      border-radius: var(--radius-xl); padding: 20px 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      flex-shrink: 0; position: sticky; top: 16px; height: calc(100vh - 32px);
    }
    .sidebar-logo { width: 44px; height: auto; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .sidebar-logo img { width: 100%; height: auto; display: block; }
    .sidebar-divider { width: 28px; height: 1px; background: rgba(255,255,255,0.08); margin: 4px 0; }
    .sidebar-icon {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      color: rgba(255,255,255,0.5); position: relative;
      text-decoration: none; background: none; border: none;
    }
    .sidebar-icon:hover { background: rgba(255,255,255,0.06); color: white; }
    .sidebar-icon.active { background: var(--gradient); color: white; }
    .sidebar-icon.active::before {
      content: ''; position: absolute; left: -16px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 24px; background: var(--teal); border-radius: 0 3px 3px 0;
    }
    .sidebar-icon svg { width: 20px; height: 20px; }
    .sidebar-nav {
      flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden; min-height: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 4px 0;
    }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 99px; }
    .sidebar-bottom { display: flex; flex-direction: column; gap: 8px; align-items: center; padding-bottom: 4px; }

    /* SHELL */
    .shell {
      flex: 1; background: var(--bg-shell); border-radius: var(--radius-xl);
      overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 32px);
    }

    /* TOPBAR */
    .topbar {
      padding: 20px 32px; display: flex; align-items: center; gap: 20px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .topbar-title { flex: 1; }
    .topbar-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--teal); margin-bottom: 2px;
    }
    .topbar-h { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .topbar-icon-btn {
      width: 40px; height: 40px; border-radius: 12px; background: var(--surface);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; color: var(--text-2);
    }
    .topbar-icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .topbar-icon-btn svg { width: 16px; height: 16px; }

    /* CONTENT */
    .content { flex: 1; overflow-y: auto; padding: 32px; }
    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 50px; }

    /* PERFIL LAYOUT */
    .perfil-grid {
      display: grid; grid-template-columns: 340px 1fr; gap: 24px;
      max-width: 1100px;
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 28px;
    }
    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .card-title svg { width: 17px; height: 17px; color: var(--teal); }

    /* FOTO */
    .foto-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .foto-avatar {
      width: 120px; height: 120px; border-radius: 50%;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 38px; font-weight: 900; color: white;
      overflow: hidden; position: relative; cursor: pointer;
      transition: opacity 0.2s; flex-shrink: 0;
    }
    .foto-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .foto-avatar:hover::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .foto-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; opacity: 0; transition: opacity 0.2s;
    }
    .foto-avatar:hover .foto-overlay { opacity: 1; }
    .foto-overlay svg { width: 22px; height: 22px; color: white; }
    #foto-input { display: none; }

    .foto-btn {
      padding: 8px 18px; border-radius: 50px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-2); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .foto-btn:hover { background: var(--surface-hover); color: var(--text); }
    .foto-btn svg { width: 14px; height: 14px; }
    .foto-note { font-size: 11px; color: var(--text-3); text-align: center; line-height: 1.5; }

    /* CERT SECTION */
    .cert-section { margin-top: 24px; }
    .cert-title {
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-3); margin-bottom: 14px;
    }
    .cert-no-asig {
      font-size: 13px; color: var(--text-3); line-height: 1.55;
      padding: 14px; background: var(--surface); border-radius: var(--radius-sm);
      border: 1px solid var(--border); font-style: italic;
    }
    .cert-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 50px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px; font-weight: 800; letter-spacing: 0.4px;
      margin-bottom: 12px;
    }
    .cert-badge.junior { background: var(--teal-light); color: var(--teal); border: 1px solid var(--teal); }
    .cert-badge.senior { background: var(--indigo-light); color: var(--indigo); border: 1px solid var(--indigo); }
    .cert-badge.master { background: var(--purple-light); color: var(--purple); border: 1px solid var(--purple); }
    .cert-badge.master_certificador {
      background: linear-gradient(135deg, rgba(212,162,86,0.15), rgba(26,171,153,0.10));
      color: #d4a256; border: 1px solid #d4a256;
    }
    .cert-badge svg { width: 13px; height: 13px; }
    .cert-meta { display: flex; flex-direction: column; gap: 6px; }
    .cert-meta-row { display: flex; justify-content: space-between; font-size: 12px; }
    .cert-meta-row span:first-child { color: var(--text-3); }
    .cert-meta-row span:last-child { color: var(--text); font-weight: 600; }
    .vigente-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 50px;
      font-size: 11px; font-weight: 700;
    }
    .vigente-badge.si { background: var(--green-light); color: var(--green); }
    .vigente-badge.no { background: var(--surface); color: var(--text-3); }

    /* FORM */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--text-3);
    }
    .form-input, .form-select, .form-textarea {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 14px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px;
      outline: none; transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--teal); background: var(--surface-hover);
    }
    .form-textarea { resize: vertical; min-height: 80px; line-height: 1.55; }
    .form-select option { background: var(--bg-card); }

    .save-indicator {
      font-size: 11px; font-weight: 600; margin-top: 4px;
      min-height: 16px; transition: all 0.3s;
    }
    .save-indicator.saved { color: var(--green); }
    .save-indicator.saving { color: var(--text-3); }
    .save-indicator.error { color: var(--red); }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--surface), var(--surface-hover), var(--surface));
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body>
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="/portal/dashboard.html" class="sidebar-logo" style="text-decoration:none">
        <img src="/logos/SX Isp.png" alt="SCALEx">
      </a>
      <div class="sidebar-nav">
      <a href="/portal/dashboard.html" class="sidebar-icon" title="Dashboard"><i data-lucide="layout-dashboard"></i></a>
      <a href="/portal/opsp.html" class="sidebar-icon" title="OPSP"><i data-lucide="map"></i></a>
      <a href="/portal/rituales.html" class="sidebar-icon" title="Rituales"><i data-lucide="repeat"></i></a>
      <div class="sidebar-divider"></div>
      <a href="/portal/reflejo.html" class="sidebar-icon" title="Reflejo"><i data-lucide="eye"></i></a>
      <a href="/portal/vector.html" class="sidebar-icon" title="Vector"><i data-lucide="compass"></i></a>
      <a href="/portal/flujo.html" class="sidebar-icon" title="Flujo Financiero"><i data-lucide="coins"></i></a>
      <a href="/portal/ritmo.html" class="sidebar-icon" title="Ritmo"><i data-lucide="activity"></i></a>
      </div>

            <div class="sidebar-bottom">
        <button class="sidebar-icon" title="Cambiar tema" onclick="toggleTheme()"><i data-lucide="sun" id="theme-icon"></i></button>
        <button class="sidebar-icon" title="Configuración"><i data-lucide="settings"></i></button>
        <button class="sidebar-icon" title="Cerrar sesión" onclick="logout()"><i data-lucide="log-out"></i></button>
      </div>
    </aside>

    <!-- SHELL -->
    <main class="shell">

      <!-- TOPBAR -->
      <div class="topbar">
        <div class="topbar-title">
          <div class="topbar-eyebrow">Portal · SCALEx</div>
          <div class="topbar-h">Mi Perfil</div>
        </div>
        <div class="topbar-actions">
          <div class="topbar-icon-btn" title="Cambiar tema" onclick="toggleTheme()">
            <i data-lucide="sun" id="topbar-theme-icon"></i>
          </div>
        </div>
      </div>

      <!-- CONTENT -->
      <div class="content">
        <div class="perfil-grid">

          <!-- Columna izquierda: foto + cert -->
          <div style="display:flex;flex-direction:column;gap:20px;">

            <!-- Foto -->
            <div class="card">
              <div class="card-title"><i data-lucide="camera"></i> Foto de perfil</div>
              <div class="foto-wrap">
                <div class="foto-avatar" id="foto-avatar" onclick="document.getElementById('foto-input').click()">
                  <span id="foto-iniciales">?</span>
                  <div class="foto-overlay"><i data-lucide="camera"></i></div>
                </div>
                <input type="file" id="foto-input" accept="image/*">
                <button class="foto-btn" onclick="document.getElementById('foto-input').click()">
                  <i data-lucide="upload"></i> Subir foto
                </button>
                <div class="foto-note">JPG o PNG · Máx 2 MB<br>Se guarda automáticamente</div>
                <div class="save-indicator" id="foto-save-indicator"></div>
              </div>
            </div>

            <!-- Certificación (solo lectura) -->
            <div class="card" id="cert-card">
              <div class="card-title"><i data-lucide="badge-check"></i> Certificación</div>
              <div class="cert-section" id="cert-section">
                <div class="skeleton" style="height:60px;"></div>
              </div>
            </div>

          </div>

          <!-- Columna derecha: datos editables -->
          <div class="card">
            <div class="card-title"><i data-lucide="user"></i> Información personal</div>
            <div class="form-grid">

              <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-input" id="field-nombre" placeholder="Roman">
                <div class="save-indicator" id="save-nombre"></div>
              </div>

              <div class="form-group">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-input" id="field-apellido" placeholder="Cantú">
                <div class="save-indicator" id="save-apellido"></div>
              </div>

              <div class="form-group full">
                <label class="form-label">Cargo</label>
                <input type="text" class="form-input" id="field-cargo" placeholder="Consultor Junior, Director, CEO…">
                <div class="save-indicator" id="save-cargo"></div>
              </div>

              <div class="form-group full">
                <label class="form-label">Bio breve</label>
                <textarea class="form-textarea" id="field-bio" placeholder="Describe brevemente tu experiencia y enfoque…"></textarea>
                <div class="save-indicator" id="save-bio"></div>
              </div>

              <div class="form-group">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-input" id="field-ciudad" placeholder="Monterrey">
                <div class="save-indicator" id="save-ciudad"></div>
              </div>

              <div class="form-group">
                <label class="form-label">País</label>
                <input type="text" class="form-input" id="field-pais" placeholder="MX">
                <div class="save-indicator" id="save-pais"></div>
              </div>

              <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-input" id="field-telefono" placeholder="+52 81 0000 0000">
                <div class="save-indicator" id="save-telefono"></div>
              </div>

              <div class="form-group">
                <label class="form-label">Años de experiencia</label>
                <select class="form-select" id="field-anios">
                  <option value="0">Sin experiencia</option>
                  <option value="1">1 año</option>
                  <option value="2">2 años</option>
                  <option value="3">3 años</option>
                  <option value="5">5 años</option>
                  <option value="10">10+ años</option>
                </select>
                <div class="save-indicator" id="save-anios"></div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons()

    function toggleTheme() {
      const html = document.documentElement
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark'
      html.dataset.theme = next
      localStorage.setItem('scalex-theme', next)
      lucide.createIcons()
    }
    function logout() {
      import('/assets/js/supabase-client.js').then(m => m.signOut())
    }

    // Aplicar tema guardado
    const savedTheme = localStorage.getItem('scalex-theme')
    if (savedTheme) document.documentElement.dataset.theme = savedTheme
  </script>

  <script type="module" src="/assets/js/portal-shell.js"></script>
  <script type="module" src="/assets/js/perfil.js"></script>
</body>
</html>
