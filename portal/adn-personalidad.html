<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCALEx Portal — ADN · Paso 1 · Perfil de Personalidad Empresarial</title>
  <link rel="icon" type="image/png" href="/logos/SX Icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/assets/js/auth-guard.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #1aab99; --teal-light: rgba(26,171,153,0.12);
      --indigo: #3533cd; --indigo-light: rgba(53,51,205,0.12);
      --gradient: linear-gradient(135deg, #1aab99, #3533cd);
      --pink: #ec4899; --pink-light: rgba(236,72,153,0.12);
      --green: #00c853; --green-light: rgba(0,200,83,0.12);
      --amber: #ff9500; --amber-light: rgba(255,149,0,0.12);
      --red: #ff3b30; --red-light: rgba(255,59,48,0.12);
      --gold: #d4a256; --gold-light: rgba(212,162,86,0.12);
      --radius-xl: 28px; --radius-lg: 20px; --radius: 14px; --radius-sm: 9px;
      --sidebar-w: 80px;
      font-family: 'Inter', sans-serif; line-height: 1.6;
    }
    [data-theme="dark"] {
      --bg-page: #0a0a0c; --bg-shell: #141416; --bg-card: #1c1c1e; --bg-card-2: #242426;
      --bg-input: #0d0d10;
      --surface: rgba(255,255,255,0.04); --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.13);
      --text: #fff; --text-2: #c7c7cc; --text-3: #8e8e93; --text-4: #48484a;
      --sidebar-bg: #050506;
    }
    [data-theme="light"] {
      --bg-page: #eef0f5; --bg-shell: #fff; --bg-card: #f5f5f7; --bg-card-2: #ebebef;
      --bg-input: #fff;
      --surface: rgba(0,0,0,0.03); --surface-hover: rgba(0,0,0,0.055);
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
      --text: #070708; --text-2: #3a3a3c; --text-3: #6e6e73; --text-4: #c7c7cc;
      --sidebar-bg: #0a0a0c;
    }
    body { background:var(--bg-page); color:var(--text); min-height:100vh; overflow:hidden; transition:background .3s,color .3s; }
    .app-layout { display:flex; min-height:100vh; padding:16px; gap:16px; }

    /* SIDEBAR */
    .sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); border-radius:var(--radius-xl); padding:20px 0; display:flex; flex-direction:column; align-items:center; gap:8px; flex-shrink:0; position:sticky; top:16px; height:calc(100vh - 32px); }
    .sidebar-logo { width:44px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; text-decoration:none; }
    .sidebar-logo img { width:100%; display:block; }
    .sidebar-divider { width:28px; height:1px; background:rgba(255,255,255,0.08); margin:4px 0; }
    .sidebar-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:rgba(255,255,255,0.5); position:relative; text-decoration:none; background:none; border:none; }
    .sidebar-icon:hover { background:rgba(255,255,255,0.06); color:white; }
    .sidebar-icon.active { background:var(--gradient); color:white; }
    .sidebar-icon.active::before { content:''; position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:3px; height:24px; background:var(--teal); border-radius:0 3px 3px 0; }
    .sidebar-icon svg { width:20px; height:20px; }
    .sidebar-nav { flex:1; width:100%; overflow-y:auto; overflow-x:hidden; min-height:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:4px 0; }
    .sidebar-nav::-webkit-scrollbar { width:3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:99px; }
    .sidebar-bottom { display:flex; flex-direction:column; gap:8px; align-items:center; padding-bottom:4px; }

    /* SHELL */
    .shell { flex:1; background:var(--bg-shell); border-radius:var(--radius-xl); overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 32px); }

    /* TOPBAR */
    .topbar { padding:18px 28px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .topbar-back { width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:var(--text-2); text-decoration:none; }
    .topbar-back:hover { background:var(--surface-hover); color:var(--text); }
    .topbar-back svg { width:16px; height:16px; }
    .topbar-title-block { flex:1; }
    .topbar-eyebrow { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--pink); }
    .topbar-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:18px; font-weight:800; color:var(--text); letter-spacing:-0.3px; margin-top:2px; }
    .topbar-actions { display:flex; align-items:center; gap:10px; }
    .topbar-icon-btn { width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; color:var(--text-2); }
    .topbar-icon-btn:hover { background:var(--surface-hover); color:var(--text); }
    .topbar-icon-btn svg { width:16px; height:16px; }
    .save-indicator { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-3); padding:6px 12px; background:var(--surface); border-radius:50px; transition:color .3s; }
    .save-indicator .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .save-indicator.saving { color:var(--amber); }
    .save-indicator.saved { color:var(--green); }
    .save-indicator.idle { color:var(--text-4); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .save-indicator.saving .dot { animation:pulse 1.4s infinite; }

    /* LAYOUT */
    .body-cols { flex:1; display:grid; grid-template-columns:1fr 340px; overflow:hidden; }

    /* LEFT — preguntas */
    .preguntas-col { display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--border); }
    .preguntas-header { padding:20px 28px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .preguntas-progress { display:flex; align-items:center; gap:10px; }
    .preguntas-progress-track { flex:1; height:5px; background:var(--surface); border-radius:99px; overflow:hidden; }
    .preguntas-progress-fill { height:100%; background:linear-gradient(90deg,#ec4899,#7c3aed); border-radius:99px; transition:width .5s ease; }
    .preguntas-progress-label { font-size:12px; font-weight:600; color:var(--text-3); white-space:nowrap; min-width:52px; text-align:right; }
    .preguntas-scroll { flex:1; overflow-y:auto; padding:20px 28px 32px; display:flex; flex-direction:column; gap:20px; }
    .preguntas-scroll::-webkit-scrollbar { width:4px; }
    .preguntas-scroll::-webkit-scrollbar-thumb { background:rgba(128,128,128,0.2); border-radius:99px; }

    /* DIMENSION LABEL */
    .dim-label { font-size:10px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--text-4); padding:6px 0 2px; margin-top:4px; }

    /* PREGUNTA CARD */
    .pregunta-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; transition:border-color .2s; }
    .pregunta-card.has-answer { border-color:rgba(236,72,153,0.3); }
    .pregunta-num { font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--pink); margin-bottom:6px; }
    .pregunta-titulo { font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:700; color:var(--text); margin-bottom:10px; }
    .pregunta-detonante { font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:16px; background:var(--surface); border-radius:var(--radius-sm); padding:12px 14px; border-left:3px solid var(--pink); }

    /* NOTAS */
    .notas-label { font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
    .notas-input { width:100%; background:var(--bg-input,var(--surface)); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text); font-size:13px; font-family:inherit; resize:vertical; min-height:56px; outline:none; transition:border-color .2s; }
    .notas-input:focus { border-color:var(--pink); }

    /* RADIO OPTIONS */
    .opciones { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
    .opcion-label { display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); transition:all .2s; background:var(--surface); }
    .opcion-label:hover { border-color:var(--pink); background:var(--pink-light); }
    .opcion-label input[type="radio"] { display:none; }
    .opcion-label.selected { border-color:var(--pink); background:var(--pink-light); }
    .opcion-tipo { width:24px; height:24px; border-radius:6px; background:var(--bg-card-2,var(--bg-card)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:800; color:var(--text-3); flex-shrink:0; transition:all .2s; }
    .opcion-label.selected .opcion-tipo { background:var(--pink); border-color:var(--pink); color:white; }
    .opcion-desc { font-size:12.5px; color:var(--text-2); line-height:1.5; padding-top:2px; }

    /* RIGHT — panel */
    .panel-col { display:flex; flex-direction:column; overflow:hidden; }
    .panel-scroll { flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:16px; }
    .panel-scroll::-webkit-scrollbar { width:4px; }
    .panel-scroll::-webkit-scrollbar-thumb { background:rgba(128,128,128,0.2); border-radius:99px; }

    /* PANEL SECTIONS */
    .panel-section { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; }
    .panel-section-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700; color:var(--text); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .panel-section-title svg { width:14px; height:14px; color:var(--pink); }

    /* PROGRESS RING */
    .ring-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .ring-svg { width:90px; height:90px; position:relative; }
    .ring-svg svg { transform:rotate(-90deg); }
    .ring-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ring-num { font-family:'Plus Jakarta Sans',sans-serif; font-size:20px; font-weight:800; color:var(--text); line-height:1; }
    .ring-max { font-size:10px; color:var(--text-4); }
    .ring-label { font-size:12px; color:var(--text-3); }

    /* RASGO BARS */
    .rasgo-row { display:flex; flex-direction:column; gap:10px; }
    .rasgo-item { display:flex; flex-direction:column; gap:4px; }
    .rasgo-header { display:flex; justify-content:space-between; align-items:center; }
    .rasgo-nombre { font-size:11.5px; font-weight:600; color:var(--text-2); text-transform:capitalize; }
    .rasgo-pct { font-size:11px; font-weight:700; color:var(--pink); }
    .rasgo-track { height:6px; background:var(--surface); border-radius:99px; overflow:hidden; }
    .rasgo-fill { height:100%; border-radius:99px; transition:width .5s ease; }

    /* MINI DOT LIST */
    .preguntas-dots { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .pregunta-dot { width:100%; aspect-ratio:1; border-radius:4px; background:var(--surface); border:1px solid var(--border); transition:all .3s; }
    .pregunta-dot.done { background:var(--pink); border-color:var(--pink); }

    /* HIBRIDO CARD */
    .hibrido-preview { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; transition:all .4s; }
    .hibrido-preview.visible { border-color:rgba(236,72,153,0.3); background:var(--pink-light); }
    .hibrido-preview-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-4); margin-bottom:6px; }
    .hibrido-preview-nombre { font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:800; color:var(--text); }
    .hibrido-preview-rasgos { font-size:11px; color:var(--text-3); margin-top:4px; }

    /* RESULTADO */
    .resultado-card { background:linear-gradient(135deg,rgba(236,72,153,0.08),rgba(124,58,237,0.08)); border:1px solid rgba(236,72,153,0.25); border-radius:var(--radius-lg); padding:20px; }
    .resultado-badge { display:inline-flex; align-items:center; gap:6px; font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:700; padding:4px 10px; border-radius:50px; background:var(--pink-light); color:var(--pink); margin-bottom:10px; }
    .resultado-nombre { font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
    .resultado-esencia { font-size:12.5px; color:var(--text-2); line-height:1.6; margin-bottom:10px; }
    .resultado-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .resultado-bloque { background:var(--surface); border-radius:var(--radius-sm); padding:10px 12px; }
    .resultado-bloque-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text-4); margin-bottom:4px; }
    .resultado-bloque-text { font-size:12px; color:var(--text-2); line-height:1.5; }
    .resultado-explorar { font-size:12px; color:var(--text-2); background:var(--surface); border-radius:var(--radius-sm); padding:10px 12px; border-left:3px solid var(--pink); line-height:1.55; }
    .resultado-explorar ul { list-style:none; display:flex; flex-direction:column; gap:5px; margin-top:6px; }
    .resultado-explorar ul li::before { content:'→ '; color:var(--pink); font-weight:700; }

    /* AGENDA */
    .agenda-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:8px; }
    .agenda-item:last-child { margin-bottom:0; }
    .agenda-dia { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.9px; color:var(--pink); margin-bottom:4px; }
    .agenda-texto { font-size:12px; color:var(--text-2); line-height:1.55; }

    /* BTN */
    .btn { padding:10px 20px; border-radius:50px; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:8px; transition:all .2s; }
    .btn svg { width:14px; height:14px; }
    .btn-primary { background:linear-gradient(135deg,#ec4899,#7c3aed); color:white; }
    .btn-primary:hover { transform:translateY(-1px); opacity:.9; }
    .btn-primary:disabled { opacity:.4; cursor:not-allowed; transform:none; }
    .btn-ghost { background:var(--surface); border:1px solid var(--border); color:var(--text); }
    .btn-ghost:hover { background:var(--surface-hover); }

    .skeleton { background:var(--surface); border-radius:6px; animation:shimmer 1.4s infinite; }
    @keyframes shimmer { 0%,100%{opacity:.5} 50%{opacity:1} }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <a href="/portal/dashboard.html" class="sidebar-logo">
      <img src="/logos/SX Icon.png" alt="SCALEx">
    </a>
    <div class="sidebar-divider"></div>
    <div class="sidebar-nav" id="sidebar-nav">
      <a href="/portal/dashboard.html" class="sidebar-icon" title="Dashboard"><i data-lucide="layout-dashboard"></i></a>
      <a href="/portal/opsp.html" class="sidebar-icon" title="OPSP"><i data-lucide="compass"></i></a>
      <a href="/portal/adn.html" class="sidebar-icon active" id="sidebar-adn" title="ADN"><i data-lucide="dna"></i></a>
    </div>
    <div class="sidebar-bottom" id="sidebar-bottom"></div>
  </nav>

  <!-- SHELL -->
  <main class="shell">
    <!-- TOPBAR -->
    <div class="topbar">
      <a href="/portal/adn.html" class="topbar-back"><i data-lucide="arrow-left"></i></a>
      <div class="topbar-title-block">
        <div class="topbar-eyebrow">ADN · Paso 1</div>
        <div class="topbar-title">Perfil de Personalidad Empresarial</div>
      </div>
      <div class="topbar-actions">
        <div class="save-indicator idle" id="save-indicator">
          <span class="dot"></span>
          <span id="save-text">—</span>
        </div>
        <button class="topbar-icon-btn" id="theme-toggle" title="Cambiar tema"><i data-lucide="sun"></i></button>
      </div>
    </div>

    <!-- BODY -->
    <div class="body-cols">

      <!-- IZQUIERDA: Preguntas -->
      <div class="preguntas-col">
        <div class="preguntas-header">
          <div class="preguntas-progress">
            <div class="preguntas-progress-track">
              <div class="preguntas-progress-fill" id="prog-fill" style="width:0%"></div>
            </div>
            <div class="preguntas-progress-label" id="prog-label">0 / 28</div>
          </div>
        </div>
        <div class="preguntas-scroll" id="preguntas-container">
          <div class="skeleton" style="height:200px;border-radius:14px"></div>
          <div class="skeleton" style="height:200px;border-radius:14px"></div>
          <div class="skeleton" style="height:200px;border-radius:14px"></div>
        </div>
      </div>

      <!-- DERECHA: Panel -->
      <div class="panel-col">
        <div class="panel-scroll">

          <!-- Progreso -->
          <div class="panel-section">
            <div class="panel-section-title"><i data-lucide="target"></i> Progreso</div>
            <div class="ring-wrap">
              <div class="ring-svg">
                <svg viewBox="0 0 90 90" width="90" height="90">
                  <circle cx="45" cy="45" r="36" fill="none" stroke="var(--border)" stroke-width="7"/>
                  <circle id="ring-arc" cx="45" cy="45" r="36" fill="none" stroke="#ec4899" stroke-width="7"
                    stroke-dasharray="226.2" stroke-dashoffset="226.2"
                    stroke-linecap="round"/>
                </svg>
                <div class="ring-text">
                  <span class="ring-num" id="ring-num">0</span>
                  <span class="ring-max">/28</span>
                </div>
              </div>
              <div class="ring-label" id="ring-label">Responde para calcular</div>
            </div>
          </div>

          <!-- Barras de rasgos -->
          <div class="panel-section">
            <div class="panel-section-title"><i data-lucide="bar-chart-2"></i> Mix de rasgos</div>
            <div class="rasgo-row" id="rasgo-bars">
              <!-- Llenado por JS -->
              <div style="font-size:12px;color:var(--text-4);text-align:center;padding:8px 0">Responde preguntas para ver el mix</div>
            </div>
          </div>

          <!-- Híbrido en tiempo real -->
          <div class="panel-section">
            <div class="panel-section-title"><i data-lucide="sparkles"></i> Personalidad emergente</div>
            <div class="hibrido-preview" id="hibrido-preview">
              <div class="hibrido-preview-label">Tipo híbrido</div>
              <div class="hibrido-preview-nombre" id="hibrido-nombre">—</div>
              <div class="hibrido-preview-rasgos" id="hibrido-rasgos">Completa más preguntas para detectar el perfil</div>
            </div>
          </div>

          <!-- Mapa de preguntas -->
          <div class="panel-section">
            <div class="panel-section-title"><i data-lucide="grid-3x3"></i> Mapa de preguntas</div>
            <div class="preguntas-dots" id="preguntas-dots"></div>
          </div>

          <!-- Resultado completo (oculto hasta completar) -->
          <div id="resultado-wrap" style="display:none">
            <div class="resultado-card" id="resultado-card">
              <!-- Llenado por JS -->
            </div>
          </div>

          <!-- Agenda 7/30/90 (oculta hasta completar) -->
          <div class="panel-section" id="agenda-wrap" style="display:none">
            <div class="panel-section-title"><i data-lucide="calendar-check"></i> Agenda 7 / 30 / 90</div>
            <div id="agenda-content"></div>
          </div>

          <!-- Botón completar -->
          <div id="btn-completar-wrap" style="display:none; padding:4px 0 12px">
            <button class="btn btn-primary" id="btn-completar" style="width:100%">
              <i data-lucide="check-circle"></i> Completar Paso 1
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<script type="module" src="/assets/js/adn-personalidad.js"></script>
<script type="module" src="/assets/js/portal-shell.js"></script>
<script>
  lucide.createIcons()
  const html = document.documentElement
  const saved = localStorage.getItem('scalex-theme') || 'dark'
  html.setAttribute('data-theme', saved)
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
    html.setAttribute('data-theme', next)
    localStorage.setItem('scalex-theme', next)
    lucide.createIcons()
  })
</script>
</body>
</html>
